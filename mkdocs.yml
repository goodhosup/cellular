site_name: Cellular Handbook — LTE · 5G NR · 6G
site_description: 4G LTE부터 5G NR, 5G-Advanced, 6G까지 — 초급부터 전문가까지 단계적으로 읽는 이동통신 핸드북
site_author: Cellular Handbook
# GitHub 저장소를 만든 뒤 아래 두 줄을 실제 주소로 바꾸세요.
site_url: https://goodhosup.github.io/cellular/
repo_url: https://github.com/goodhosup/cellular
repo_name: cellular
edit_uri: edit/main/docs/
copyright: 본문과 그림은 직접 작성했습니다. 3GPP 스펙 번호와 절(clause)은 출처 표기로만 인용합니다.

theme:
  name: material
  language: ko
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  icon:
    logo: material/antenna
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - content.action.edit

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - path: javascripts/diagrams.mjs
    type: module

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.mark
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        # Material 기본 Mermaid 통합 대신 javascripts/diagrams.mjs가 렌더링 (큰 시퀀스 다이어그램 가독성)
        - name: mermaid
          class: diagram-src
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang:
        - en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'

validation:
  anchors: warn

watch:
  - includes

nav:
  - 홈: index.md
  - 시작하기:
      - getting-started/index.md
      - 이동통신 세대의 진화: getting-started/generations.md
      - 3GPP와 릴리즈 타임라인: getting-started/3gpp-releases.md
      - 스펙 문서 읽는 법: getting-started/reading-specs.md
      - 학습 로드맵: getting-started/roadmap.md
  - 공통 기초:
      - basics/index.md
      - 무선 전파와 채널: basics/radio-channel.md
      - 디지털 변조 (QAM): basics/modulation.md
      - OFDM 원리: basics/ofdm.md
      - OFDMA와 DFT-s-OFDM: basics/ofdma-scfdma.md
      - 채널 코딩 (Turbo·LDPC·Polar): basics/channel-coding.md
      - HARQ: basics/harq.md
      - MIMO 기초: basics/mimo.md
      - 빔포밍: basics/beamforming.md
      - 듀플렉싱 (FDD/TDD): basics/duplexing.md
